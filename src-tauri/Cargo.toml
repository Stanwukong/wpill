[package]
name = "topbar"
version = "0.1.0"
description = "Dynamic Island-style top bar for Windows 11"
edition = "2021"

[lib]
name = "topbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
png = "0.17"
tauri-plugin-single-instance = "2"
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep the major/minor in step with the version Tauri uses (`cargo tree -i windows`)
# so `WebviewWindow::hwnd()` returns the same HWND type we use.
[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
